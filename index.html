/* RAWNAK ACADEMY V5 — additive layer; core V4 layout, cards, interactions and motion remain unchanged. */
html{color-scheme:light}html[data-appearance="dark"]{color-scheme:dark}
html,body,.site-header,.hero,.section,.page,.course-card,.style-panel,.classroom{transition:background-color .35s ease,color .25s ease,border-color .25s ease}
html[data-appearance="dark"] body{background:var(--bg)}
html[data-appearance="dark"] .site-header{background:color-mix(in srgb,var(--paper) 92%,transparent);border-color:var(--stroke)}
html[data-appearance="dark"] .course-card,html[data-appearance="dark"] .benefit-card,html[data-appearance="dark"] .leader-card,html[data-appearance="dark"] .board-panel{border-color:var(--stroke)}
html[data-appearance="dark"] .course-art{filter:saturate(.88) brightness(.86)}
html[data-appearance="dark"] .hero-canvas{box-shadow:inset 0 0 0 1px var(--stroke)}
html[data-appearance="dark"] .floating-chip,html[data-appearance="dark"] .study-card{background:var(--surface);color:var(--ink);border-color:var(--stroke)}
html[data-appearance="dark"] .study-art{color:#f4f5ec}
html[data-appearance="dark"] .dark-section{border-block:1px solid color-mix(in srgb,var(--brand) 10%,var(--stroke))}
html[data-appearance="dark"] .cta-section{background:var(--hero-tint)}
html[data-appearance="dark"] .style-button{box-shadow:0 12px 38px #03090a80}
html[data-appearance="dark"] .modal{background:var(--surface);border-color:var(--stroke)}
html[data-appearance="dark"] .text-field,html[data-appearance="dark"] .search-box input,html[data-appearance="dark"] select{background:var(--paper);color:var(--ink)}
html[data-appearance="dark"] .course-info p{color:var(--muted)}
/* The new Studio keeps curated themes simple; expert controls stay collapsed. */
.style-panel.v5-studio{width:365px;max-width:calc(100vw - 28px);max-height:min(80vh,785px);overflow-y:auto;padding:22px;scrollbar-width:thin;overscroll-behavior:contain}
.v5-mode-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:11px 0 19px}
.v5-mode-grid button{border:1px solid var(--stroke);color:var(--ink);background:var(--paper);padding:11px 6px;border-radius:11px;display:flex;justify-content:center;align-items:center;gap:6px;font-weight:750;font-size:11px}
.v5-mode-grid button.active{color:var(--brand-ink);border-color:var(--brand);background:var(--brand)}
.v5-mode-grid svg{width:15px;height:15px}
.v5-palette-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.v5-palette-grid .palette-choice{width:100%;min-height:85px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;border-radius:13px;border:1px solid var(--stroke);background:var(--paper);padding:11px;color:var(--ink)}
.v5-palette-grid .palette-choice.selected{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset;background:var(--brand-pale)}
.v5-palette-grid .palette-balls{display:flex;gap:4px}.v5-palette-grid .palette-balls i{display:block;width:21px;height:21px;border-radius:50%;border:1px solid #ffffff33}
.v5-palette-grid .palette-choice>span:last-child{font-size:12px;display:flex;flex-direction:column;gap:2px}
.v5-palette-grid .palette-choice small{font-size:10px;color:var(--muted)}
.v5-studio details{margin:17px 0 2px;border-top:1px solid var(--stroke);padding-top:13px}
.v5-studio summary{font-size:13px;font-weight:800;list-style:none;cursor:pointer;padding:8px 0;display:flex;align-items:center;justify-content:space-between}
.v5-studio summary::-webkit-details-marker{display:none}
.v5-studio summary::after{content:'+';font-size:20px;font-weight:400}
.v5-studio details[open] summary::after{content:'−'}
.v5-studio .studio-save{margin-top:22px}
.v5-contrast{padding:10px 12px;background:var(--paper);border:1px solid var(--stroke);border-radius:10px;line-height:1.6;font-size:11px;margin-top:10px;color:var(--muted)}
.v5-contrast strong{color:var(--ink);font-size:11px}.v5-contrast.pass{border-color:color-mix(in srgb,var(--brand) 40%,var(--stroke))}
.v5-contrast.fail{border-color:#d58d72}
.v5-studio .style-label{margin-top:15px}
.v5-study-hint{padding:13px 15px;margin:15px 0;background:var(--v5-study-soft);border:1px solid var(--v5-study-line);border-radius:12px;font-size:12px;line-height:1.7;color:var(--v5-study-muted)}
.v5-player-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;color:var(--v5-study-muted)}
.v5-player-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.v5-control{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--v5-study-card);color:var(--v5-study-ink);border:1px solid var(--v5-study-line);padding:10px 12px;border-radius:10px;font-size:11px;font-weight:750}
.v5-control:hover{border-color:var(--brand)}.v5-control.active{background:var(--v5-study-soft);border-color:var(--brand)}
.v5-speed{display:flex;align-items:center;gap:8px;font-size:11px}.v5-speed select{background:var(--v5-study-card);color:var(--v5-study-ink);border:1px solid var(--v5-study-line);padding:9px 8px;border-radius:10px}
.classroom{--v5-study-bg:#f7f8f7;--v5-study-card:#fff;--v5-study-ink:#26312e;--v5-study-muted:#65736e;--v5-study-soft:#eaf2ed;--v5-study-line:#dfe7e1;--v5-study-highlight:#2c684e;background:var(--v5-study-bg);color:var(--v5-study-ink)}

  <script>
/* RAWNAK ACADEMY V3 — English interactive frontend concept. No real payment, account or reward issuance. */
const $=s=>document.querySelector(s);
const icon=(id,cls='ic')=>`<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"></use></svg>`;
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storage={get(k,alt){try{let v=localStorage.getItem('rawnak_academy_v3_'+k);return v===null?alt:JSON.parse(v)}catch{return alt}},set(k,v){try{localStorage.setItem('rawnak_academy_v3_'+k,JSON.stringify(v))}catch{}}};
const courses=[
 {id:'design',title:'Design that feels different.',sub:'Build interfaces people remember, from your first grid to final polish.',category:'Design',tag:'Creative path',level:'Beginner',duration:'12 hours',count:28,teacher:'RAWNAK Creative Studio',art:'design',number:'01',badge:'MOST EXPLORED'},
 {id:'development',title:'Build for the web.',sub:'Learn modern frontend fundamentals by shipping thoughtful digital projects.',category:'Development',tag:'Build path',level:'Beginner',duration:'20 hours',count:42,teacher:'RAWNAK Development Lab',art:'development',number:'02',badge:'SKILL TRACK'},
 {id:'business',title:'From idea to impact.',sub:'Turn a small idea into a real, sustainable project with a clear roadmap.',category:'Business',tag:'Founder path',level:'All levels',duration:'8 hours',count:18,teacher:'RAWNAK Business Studio',art:'business',number:'03',badge:'FOUNDERS EDITION'},
 {id:'motion',title:'Motion with meaning.',sub:'Make transitions and movement feel natural, intentional, and alive.',category:'Design',tag:'Creative path',level:'Intermediate',duration:'10 hours',count:22,teacher:'RAWNAK Creative Studio',art:'motion',number:'04',badge:'EXPLORE MOTION'},
 {id:'ai',title:'Make AI work for you.',sub:'Build thoughtful AI workflows that support real projects and work.',category:'Technology',tag:'Productivity path',level:'All levels',duration:'9 hours',count:19,teacher:'RAWNAK Technology Lab',art:'ai',number:'05',badge:'NEW PERSPECTIVES'},
 {id:'photography',title:'Tell stories visually.',sub:'Learn light, framing, composition, and the art of a visual narrative.',category:'Design',tag:'Creative path',level:'Beginner',duration:'7 hours',count:16,teacher:'RAWNAK Creative Studio',art:'photography',number:'06',badge:'VISUAL PRACTICE'}
];
const lessons=[
 {title:'An introduction to the journey',duration:'03:20',description:'A calm introduction to your learning space, the process, and what you will create.',summary:'Great design begins with a clear intention. In this lesson, we map your goals, explore the structure of the course, and make room for experimentation without pressure.'},
 {title:'Think like a designer',duration:'08:45',description:'Practice looking at interfaces through the lens of usefulness and clarity.',summary:'A strong visual solution starts with understanding a problem. We explore hierarchy, context, user needs, and the questions worth asking before opening a design tool.'},
 {title:'The details that matter',duration:'12:10',description:'Work with spacing, alignment, rhythm, hierarchy, and contrast.',summary:'Explore the fundamentals behind polished digital experiences, then apply them to a small layout exercise with intentional spacing and typography.'},
 {title:'Create your first project',duration:'15:30',description:'Bring it all together with a short practical design challenge.',summary:'Shape a landing page from rough structure to a clear, balanced final design, with a practical checklist for reviewing your own decisions.'}
];
const rewards=[
 {id:'voucher',name:'Next course voucher',desc:'A sample course discount reward to demonstrate how Credits can work.',cost:250,icon:'gift'},
 {id:'templates',name:'Creative template collection',desc:'A sample selection of practical resources for your next project.',cost:150,icon:'book'},
 {id:'review',name:'Personal project review',desc:'A sample one-to-one feedback benefit for developing students.',cost:350,icon:'spark'}
];
const samples={weekly:[['OL','Olivia Lane',860],['AH','Adam Hassan',740],['EM','Emma Morgan',620],['NS','Noah Stone',510],['LM','Lina Mostafa',420]],monthly:[['AH','Adam Hassan',3480],['OL','Olivia Lane',3270],['LM','Lina Mostafa',2980],['EM','Emma Morgan',2630],['NS','Noah Stone',2410]],season:[['OL','Olivia Lane',8250],['LM','Lina Mostafa',7800],['AH','Adam Hassan',7540],['NS','Noah Stone',7130],['EM','Emma Morgan',6820]]};
const state={theme:storage.get('theme','atelier'),type:storage.get('type','editorial'),name:storage.get('name','Guest learner'),credits:storage.get('credits',420),xp:storage.get('xp',1180),weeklyXP:storage.get('weeklyXP',160),completed:storage.get('completed',[]),notes:storage.get('notes',{}),redemptions:storage.get('redemptions',[]),quizDone:storage.get('quizDone',false),courseBonus:storage.get('courseBonus',false),lesson:storage.get('lesson',0),category:'All',query:'',period:'weekly',tab:'overview',mobile:false,styleOpen:false,modal:null,selectedAnswer:null};
const persist=()=>['theme','type','name','credits','xp','weeklyXP','completed','notes','redemptions','quizDone','courseBonus','lesson'].forEach(k=>storage.set(k,state[k]));
const num=n=>Number(n).toLocaleString('en-US');
const getCourse=id=>courses.find(c=>c.id===id)||courses[0];
const activeRoute=()=>decodeURI(location.hash.replace(/^#\/?/,''))||'home';
function notify(msg){const t=$('#toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.remove('show'),3100)}
function navigate(route){state.mobile=false;state.styleOpen=false;state.modal=null;if(activeRoute()===route){render();window.scrollTo({top:0,behavior:'instant'})}else location.hash='#/'+route}
function logo(){return `<a class="logo" href="#/home" aria-label="RAWNAK Academy home"><span class="brand-icon v76-brand-icon"><img src="assets/rawnak-academy-logo.webp" width="52" height="52" alt="" decoding="async" /></span><span class="logo-text"><strong>RAWNAK</strong><small>ACADEMY</small></span></a>`}
const navItems=[['home','Discover'],['courses','Courses'],['my-learning','My Learning'],['wallet','Rewards'],['leaderboard','Leaderboard']];
function header(active){let cur=active.startsWith('course/')?'courses':active;return `<div class="announcement"><span>LEARN DIFFERENTLY</span><span class="dot"></span><span>GROW WITH INTENTION</span><span class="dot"></span><span>GET REWARDED</span></div><header class="site-header"><div class="container header-in">${logo()}<nav class="header-links" aria-label="Main navigation">${navItems.map(([r,l])=>`<button class="nav-link ${cur===r?'active':''}" data-nav="${r}">${l}</button>`).join('')}</nav><div class="header-actions"><button class="credit-pill" data-nav="wallet" aria-label="View your credits">${icon('coin')} ${num(state.credits)} CR</button><button class="btn sm outline" data-action="signin">${state.name==='Guest learner'?'Sign in':'My profile'}</button><button class="mobile-toggle" data-action="toggleMenu" aria-label="Toggle menu" aria-expanded="${state.mobile}">${icon(state.mobile?'close':'menu')}</button></div></div>${state.mobile?`<nav class="mobile-nav" aria-label="Mobile navigation">${navItems.map(([r,l])=>`<button data-nav="${r}">${l}</button>`).join('')}<button data-action="signin">Profile</button></nav>`:''}</header>`}
function footer(){return `<footer class="footer"><div class="container"><div class="footer-main">${logo()}<div class="footer-links"><a href="#/courses">Courses</a><a href="#/wallet">Rewards</a><a href="#/leaderboard">Community</a><a href="#/my-learning">My Learning</a><a href="https://rawnakgroup.com" target="_blank" rel="noopener">Rawnak Group ${icon('ne')}</a></div></div><div class="footer-bottom"><span>© 2026 RAWNAK ACADEMY — A RAWNAK GROUP CONCEPT</span><span>INTERACTIVE DESIGN PROTOTYPE · CONTENT, POINTS & REWARDS ARE SAMPLE DATA</span></div></div></footer>`}
function art(c){let mark={design:'<span class="symbol-main">Aa<span style="font-family:var(--font-serif);font-style:italic">.</span></span><span class="symbol-ring"></span>',development:'<span class="symbol-code">&lt;/&gt;</span><span class="symbol-ring secondary"></span>',business:'<span class="symbol-biz">↗</span>',motion:'<span class="symbol-orbit"></span>',ai:'<span class="symbol-main" style="transform:rotate(0);font-size:112px">AI.</span><span class="symbol-ring secondary"></span>',photography:'<span class="symbol-photo"></span>'}[c.art];return `<div class="course-art ${c.art}"><div class="card-art-eyebrow"><span>RAWNAK / ${escapeHtml(c.category)}</span><span class="card-art-number">${c.number}</span></div><div class="art-symbol">${mark}</div><div class="art-caption"><span>${escapeHtml(c.tag)}</span><span>${escapeHtml(c.badge)}</span></div></div>`}
function courseCard(c){return `<article class="course-card reveal" tabindex="0" role="button" data-action="course" data-id="${c.id}" aria-label="View ${escapeHtml(c.title)}">${art(c)}<div class="course-info"><div class="course-meta"><span>${escapeHtml(c.category)}</span><span>${escapeHtml(c.duration)}</span></div><h3>${escapeHtml(c.title)}</h3><p>${escapeHtml(c.sub)}</p><div class="course-bottom"><div><b>${c.count} lessons</b> <small>· ${escapeHtml(c.level)}</small></div><span class="round-icon">${icon('ne')}</span></div></div></article>`}
function courseFilter(){return `<div class="category-row">${['All','Design','Development','Business','Technology'].map(v=>`<button class="category-btn ${state.category===v?'active':''}" data-action="filter" data-category="${v}">${v==='All'?'All courses':v}</button>`).join('')}</div>`}
function hero(){return `<section class="hero"><div class="container"><div class="hero-copy appear"><div class="mini-pill">${icon('spark')} Introducing a new kind of academy</div><h1>Learn<br/>beautifully.<br/><span class="serif">Grow</span> boldly.</h1><p class="hero-desc">A considered space for curious minds. Learn practical skills, create work you are proud of, and turn every milestone into something more.</p><div class="hero-buttons"><button class="btn primary" data-nav="courses">Explore courses ${icon('ne')}</button><button class="btn outline" data-nav="classroom">${icon('play')} Experience a lesson</button></div><div class="hero-proof"><div class="hero-proof-item"><strong>06</strong><span>Curated sample paths</span></div><span class="proof-sep"></span><div class="hero-proof-item"><strong>01</strong><span>Purposeful learning space</span></div><span class="proof-sep"></span><div class="hero-proof-item"><strong>∞</strong><span>Room to grow</span></div></div></div><div class="hero-canvas appear" aria-label="Visual preview of the learning platform"><div class="canvas-dots"></div><div class="canvas-disc"></div><div class="canvas-ring"></div><div class="canvas-word">RA.</div><div class="study-card"><div class="study-top"><b>RAWNAK / YOUR STUDIO</b><div class="study-dots"><span></span><span></span><span></span></div></div><div class="study-art"><div class="study-art-top"><span>DESIGN SYSTEMS 01</span><span>CREATIVE PATH</span></div><div class="study-art-ring"></div><strong>Design for<br/><em>tomorrow.</em></strong></div><div class="study-bottom"><b>Design that feels different.</b><small>Make space for your next idea.</small><div class="progress"><span style="width:${state.completed.length/lessons.length*100||38}%"></span></div><div class="progress-caption"><span>YOUR LEARNING JOURNEY</span><strong>${state.completed.length?Math.round(state.completed.length/lessons.length*100):38}%</strong></div></div></div><div class="floating-chip one"><span class="chip-icon">${icon('zap')}</span><span><b>+25 XP</b><small>For every lesson learned</small></span></div><div class="floating-chip two"><span class="chip-icon">${icon('coin')}</span><span><b>${num(state.credits)} CR</b><small>Credits you can use</small></span></div><div class="canvas-stamp">GOOD<br/>THINGS<br/>TAKE<br/>PRACTICE</div></div></div></section>`}
function ticker(){let bits=['CREATE YOUR NEXT CHAPTER','CURIOUS MINDS WELCOME','PRACTICE MAKES PROGRESS','SKILLS THAT STAY WITH YOU'];let line=bits.map(s=>`<span>${s}</span><span class="tstar">✳</span>`).join('');return `<div class="ticker"><div class="ticker-track">${line}${line}</div></div>`}
function featuredCourses(){return `<section class="section" id="featured"><div class="container"><div class="section-head reveal"><div><div class="kicker">THE COURSE COLLECTION</div><h2>Learn something<br/><span class="serif">worth keeping.</span></h2></div><button class="btn outline" data-nav="courses">View all courses ${icon('ne')}</button></div><div class="course-grid">${courses.slice(0,3).map(courseCard).join('')}</div></div></section>`}
function momentumSection(){return `<section class="dark-section"><div class="container dark-layout"><div class="dark-copy reveal"><div class="kicker">YOUR EFFORT, RECOGNIZED</div><h2>Progress is<br/>the new <em class="serif">currency.</em></h2><p>Every completed lesson is a step forward. Earn Academy XP to track your achievements and Credits to unlock rewards. Keep learning because it matters — enjoy the extras along the way.</p><button class="btn" data-nav="wallet">Discover the rewards ${icon('ne')}</button></div><div class="dashboard-visual reveal"><div class="dash-heading"><strong>YOUR LEARNING DASHBOARD</strong><span>PERSONAL / PREVIEW</span></div><div class="dash-stats"><div class="dash-stat"><span class="small-icon">${icon('zap')}</span><strong>${num(state.xp)}</strong><small>Academy XP · never spent</small></div><div class="dash-stat"><span class="small-icon">${icon('coin')}</span><strong>${num(state.credits)}</strong><small>Credits · redeem for rewards</small></div></div><div class="dash-graph">${[26,50,38,70,61,78,100,73,88].map(v=>`<i style="height:${v}%"></i>`).join('')}</div><div style="display:flex;justify-content:space-between;gap:10px;margin-top:12px;color:color-mix(in srgb,var(--dark-text) 60%,transparent);font-size:10px"><span>LEARNING MOMENTUM</span><span>KEEP MOVING FORWARD ↗</span></div></div></div></section>`}
function benefits(){const list=[{cls:'main',icon:'gift',title:'Learn more. Get more.',desc:'Progress should feel rewarding. Unlock meaningful extras while building skills that last.'},{icon:'book',title:'A space made for focus.',desc:'A calm lesson player, thoughtful notes, and room to think.'},{icon:'trophy',title:'Move up together.',desc:'Time-based learning challenges and community leaderboards.'}];return `<section class="section"><div class="container"><div class="section-head reveal"><div><div class="kicker">MORE THAN A COURSE</div><h2>A different kind<br/>of <em class="serif">learning experience.</em></h2></div></div><div class="benefit-grid">${list.map(b=>`<div class="benefit ${b.cls||''} reveal"><span class="benefit-icon">${icon(b.icon)}</span><h3>${b.title}</h3><p>${b.desc}</p></div>`).join('')}</div></div></section>`}
function scoreboard(period='weekly',limit=4){let data=[...samples[period],['YOU',state.name==='Guest learner'?'You (preview)':state.name,period==='weekly'?state.weeklyXP:period==='monthly'?state.xp:state.xp+3200]].sort((a,b)=>b[2]-a[2]);return data.slice(0,limit).map((a,i)=>`<div class="leader-item ${a[0]==='YOU'?'me':''}"><span class="rank">${String(i+1).padStart(2,'0')}</span><span class="avatar">${a[0]==='YOU'?'ME':a[0]}</span><span><strong>${escapeHtml(a[1])}</strong><small>${a[0]==='YOU'?'Your demo profile':'Sample learner'}</small></span><span class="pts">${num(a[2])} XP</span></div>`).join('')}
function leaderboardPromo(){return `<section class="section" style="padding-top:25px"><div class="container leader-preview"><div class="reveal"><div class="kicker">COMMUNITY & CHALLENGES</div><h2>A little<br/>healthy <em class="serif" style="color:var(--brand)">ambition.</em></h2><p>Build momentum with weekly, monthly and seasonal learning challenges. Celebrate people who put learning into practice.</p><button class="btn primary" data-nav="leaderboard">Explore the leaderboard ${icon('ne')}</button></div><div class="leader-card reveal"><div class="leader-card-head"><b>THIS WEEK'S HIGHLIGHTS</b><span>DEMO STANDINGS</span></div>${scoreboard('weekly',4)}</div></div></section>`}
function cta(){return `<section class="cta-section"><div class="container reveal"><div class="kicker" style="justify-content:center">A BETTER WAY FORWARD</div><h2>Your next chapter<br/><em class="serif">starts here.</em></h2><p>Find a course that sparks your curiosity and make the first step count.</p><button class="btn dark" data-nav="courses">Find your course ${icon('ne')}</button></div></section>`}
function home(){return hero()+ticker()+featuredCourses()+momentumSection()+benefits()+leaderboardPromo()+cta()}
function coursesPage(){let selected=courses.filter(c=>(state.category==='All'||c.category===state.category)&&(`${c.title} ${c.sub} ${c.category}`.toLowerCase().includes(state.query.toLowerCase())));return `<main class="page"><div class="container"><div class="page-top"><div><div class="kicker">FIND YOUR NEXT SKILL</div><h1>The <em class="serif">collection.</em></h1><p>Explore thoughtfully created learning paths across design, technology, business and creative practice.</p></div><label class="search-box">${icon('search')}<input id="course-search" value="${escapeHtml(state.query)}" placeholder="Search courses" aria-label="Search courses" /></label></div><div id="course-filter">${courseFilter()}</div><div class="course-grid" id="course-results">${selected.length?selected.map(courseCard).join(''):'<div class="empty-state"><h3>Nothing found yet.</h3><p>Try a different search or category.</p></div>'}</div><div class="demo-note" style="margin-top:40px">All courses, lesson counts and instructors here are illustrative content for a design preview — not an active course catalogue.</div></div></main>`}
function courseDetails(id){let c=getCourse(id);return `<main class="page"><div class="container"><button class="btn plain" data-nav="courses">${icon('arrow')} Back to all courses</button><div class="course-detail"><div><div class="kicker" style="margin-top:35px">${escapeHtml(c.category)} / ${escapeHtml(c.tag)}</div><h1>${escapeHtml(c.title)}</h1><p>${escapeHtml(c.sub)} A practical, supportive learning experience with clear steps, activities and a calmer place to work.</p><div class="detail-facts"><span>${icon('clock')} ${c.duration}</span><span>${icon('book')} ${c.count} lessons</span><span>${icon('spark')} ${c.level}</span></div><button class="btn primary" data-nav="classroom">Explore the lesson player ${icon('ne')}</button><div class="curriculum"><h2>A closer look at the path</h2>${lessons.map((l,i)=>`<div class="outline-lesson"><span>${String(i+1).padStart(2,'0')}</span><b>${escapeHtml(l.title)}</b><span style="margin-left:auto;color:var(--muted)">${l.duration}</span></div>`).join('')}</div></div><aside class="detail-box">${art(c)}<div class="detail-box-content"><div class="eyebrow">COURSE PREVIEW</div><strong>Learn at your pace.</strong><p style="font-size:13px">Watch the sample lesson and explore the student experience before launch.</p><button class="btn primary" data-nav="classroom">Open lesson demo ${icon('arrow')}</button><small>Preview only. No checkout, enrollment or payment is connected.</small></div></aside></div></div></main>`}
function walletPage(){return `<main class="page"><div class="container"><div class="page-top"><div><div class="kicker">REWARDING THE WORK</div><h1>Your <em class="serif">rewards.</em></h1><p>Progress becomes possibility. Academy XP marks your achievements, while Credits can be exchanged for sample rewards.</p></div></div><div class="wallet-grid"><div class="wallet-card"><div class="eyebrow">YOUR CREDITS / DEMO WALLET</div><div class="balance">${num(state.credits)}<span class="balance-suffix"> CR</span></div><p>Earn through completed learning, redeem for benefits.</p><div style="font-size:11px;opacity:.7;margin-top:40px">RAWNAK / REWARDS PROGRAMME</div></div><div class="wallet-summary"><div class="summary-tile">${icon('zap')}<div><strong>${num(state.xp)}</strong><br/><small>Lifetime Academy XP</small></div></div><div class="summary-tile">${icon('trophy')}<div><strong>${num(state.weeklyXP)}</strong><br/><small>XP this week (demo)</small></div></div><div class="summary-tile">${icon('check')}<div><strong>${state.completed.length} / ${lessons.length}</strong><br/><small>Completed demo lessons</small></div></div><div class="summary-tile">${icon('gift')}<div><strong>${state.redemptions.length}</strong><br/><small>Demo redemptions</small></div></div></div></div><section class="section" style="padding-bottom:30px"><div class="section-head compact"><div><div class="kicker">THE REWARD COLLECTION</div><h2>Make it <em class="serif">count.</em></h2></div></div><div class="reward-grid">${rewards.map(r=>`<article class="reward-card"><span class="reward-icon">${icon(r.icon)}</span><h3>${r.name}</h3><p>${r.desc}</p><div class="reward-footer"><b>${num(r.cost)} CR</b><button class="btn sm ${state.credits>=r.cost?'primary':'outline'}" data-action="redeem" data-id="${r.id}" ${state.credits<r.cost?'disabled':''}>${state.credits>=r.cost?'Preview redeem':'Not enough CR'}</button></div></article>`).join('')}</div><div class="rewards-history"><h3>Your preview activity</h3>${state.redemptions.length?`<p>${state.redemptions.map(x=>escapeHtml(x)).join(' · ')}</p>`:'<p>No demo redemptions yet. Pick a reward to try the experience.</p>'}<p><b>Demo only:</b> credits, discounts and rewards shown here are simulated and do not create real vouchers or purchases.</p></div></section></div></main>`}
function leaderboardPage(){return `<main class="page"><div class="container"><div class="page-top"><div><div class="kicker">BETTER, TOGETHER</div><h1>The <em class="serif">leaderboard.</em></h1><p>Celebrate learning and consistent practice through time-based challenges. Only demonstrated learning achievements earn XP.</p></div></div><div class="board-grid"><section class="board-panel"><div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:13px;margin-bottom:17px"><div><div class="eyebrow">COMMUNITY RANKINGS</div><p style="color:var(--muted);font-size:11px">Illustrative names and standings</p></div><div class="period-options">${[['weekly','Weekly'],['monthly','Monthly'],['season','Season']].map(([id,label])=>`<button class="${state.period===id?'active':''}" data-action="period" data-period="${id}">${label}</button>`).join('')}</div></div><div id="leaderboard-rows">${scoreboard(state.period,9)}</div></section><aside class="board-side">${icon('trophy')}<h3>Learn for the long game.</h3><p>Challenge windows keep the competition fresh. Your XP never disappears when you spend Credits, and purchasing a course is not enough to earn a ranking.</p><p>Prizes, rules, eligibility and anti-abuse checks will be published before any real challenge begins.</p><button class="btn" data-nav="classroom">Earn XP in a lesson ${icon('ne')}</button></aside></div></div></main>`}
function tabContent(){let l=lessons[state.lesson];if(state.tab==='notes')return `<h3>Your private notes</h3><p>Write down ideas, questions and tiny breakthroughs as you go. Notes in this preview stay in this browser.</p><textarea id="lesson-notes" class="notes-input" placeholder="What stood out to you today?">${escapeHtml(state.notes[state.lesson]||'')}</textarea><p class="notes-help">Automatically saved in your browser. Do not enter sensitive information.</p>`;if(state.tab==='resources')return `<h3>Resources & practice</h3><p>Suggested practice: open your favorite design app and recreate one clear, well-spaced interface element.</p><p>${icon('check')} Write down three choices you made and why.</p><p>${icon('check')} Reflect on hierarchy, space and readability.</p><p>Course materials shown here are sample lesson content.</p>`;return `<h3>What you'll learn</h3><p>${escapeHtml(l.summary)}</p><p>${escapeHtml(l.description)}</p><p><b>A small next step:</b> take one idea from this lesson and apply it to a real project. Keep it practical, keep it yours.</p>`}

function styleSwitcher(){const palettes=[['atelier','Terracotta / Paper',['#f7f5f0','#c75a45','#203535']],['arctic','Arctic / Cobalt',['#f2f5f9','#2863d6','#142c4a']],['grove','Juniper / Oat',['#f3f4ec','#337d67','#1d3d34']]];return `<div class="style-switch"><button class="style-button" data-action="style" aria-expanded="${state.styleOpen}"><span class="style-swatch"></span> Design lab ${icon(state.styleOpen?'close':'spark')}</button>${state.styleOpen?`<div class="style-panel"><strong>Explore the visual direction</strong><p>Try three complete color systems and Framer-compatible font pairings.</p><span class="style-label">Colour palette</span><div class="palette-choices">${palettes.map(([id,name,colors])=>`<button class="palette-choice ${state.theme===id?'selected':''}" data-action="theme" data-theme="${id}"><span class="palette-balls">${colors.map(c=>`<i style="background:${c}"></i>`).join('')}</span><span>${name}</span></button>`).join('')}</div><label class="style-label" for="font-choice">Typography pairing</label><select id="font-choice" class="style-select" aria-label="Choose typography"><option value="editorial" ${state.type==='editorial'?'selected':''}>Inter Tight + Instrument Serif</option><option value="modern" ${state.type==='modern'?'selected':''}>Manrope + Instrument Serif</option><option value="minimal" ${state.type==='minimal'?'selected':''}>Inter + Inter Tight</option></select><p class="style-hint">Styles available in Framer's web font ecosystem. This is a coded concept, not a native Framer canvas file.</p></div>`:''}</div>`}

 if(state.modal==='signin')return wrap('Preview your profile',`<p>Choose a display name for this local design demo. This is not authentication and no account is created.</p><form id="profile-form"><label class="form-label" for="profile-name">Your display name</label><input id="profile-name" class="text-field" maxlength="40" required value="${escapeHtml(state.name==='Guest learner'?'':state.name)}" placeholder="e.g. Alex Morgan"/><button type="submit" class="btn primary" style="width:100%">Save preview profile ${icon('arrow')}</button></form>`);
 if(state.modal.startsWith('redeem:')){let r=rewards.find(x=>x.id===state.modal.split(':')[1]);return wrap('Preview a redemption',`<p>Redeem <b>${escapeHtml(r.name)}</b> for <b>${r.cost} Credits</b>?</p><div class="modal-note">This changes your demo wallet only. No real voucher, review or product will be issued.</div><div style="display:flex;gap:12px;margin-top:25px"><button class="btn outline" data-action="closeModal">Cancel</button><button class="btn primary" data-action="confirmRedeem" data-id="${r.id}">Confirm preview ${icon('arrow')}</button></div>`)}
 if(state.modal==='quiz')return wrap('A quick knowledge check',`<p>Which of these best describes thoughtful interface design?</p>${[['a','Use as many effects as possible'],['b','Choose clear hierarchy and purposeful detail'],['c','Ignore the learner’s needs']].map(([v,l])=>`<button class="quiz-option ${state.selectedAnswer===v?'selected':''}" data-action="answer" data-value="${v}">${l}</button>`).join('')}<button class="btn primary" style="width:100%;margin-top:13px" data-action="submitQuiz" ${!state.selectedAnswer?'disabled':''}>Submit answer ${icon('arrow')}</button><p class="modal-note">Correct first-time completion: +60 XP and +15 Credits. Demo rewards can only be earned once.</p>`);
 return ''}
function render(){const route=activeRoute();let body=route==='home'?home():route==='courses'?coursesPage():route==='wallet'?walletPage():route==='leaderboard'?leaderboardPage():route==='my-learning'?myLearningPage():route==='classroom'?classroomPage():route.startsWith('course/')?courseDetails(route.split('/')[1]):home();document.documentElement.dataset.theme=state.theme;document.documentElement.dataset.type=state.type;$('#app').innerHTML=header(route)+body+(route==='classroom'?'':footer())+`<div id="style-area">${styleSwitcher()}</div>`;$('#modals').innerHTML=modalMarkup();activateReveals()}
function activateReveals(){const sections=$$('.reveal');if(!('IntersectionObserver'in window)){sections.forEach(e=>e.classList.add('visible'));return}let obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target)}})},{threshold:.1});sections.forEach(e=>obs.observe(e))}

function handleAction(target){let action=target.dataset.action,route=target.dataset.nav;if(route){navigate(route);return}if(!action)return;
 if(action==='toggleMenu'){state.mobile=!state.mobile;render();return}if(action==='signin'){state.modal='signin';renderModal();return}if(action==='closeModal'){state.modal=null;renderModal();return}if(action==='modalBackdrop'){if(target.classList.contains('modal-backdrop')){state.modal=null;renderModal()}return}if(action==='course'){navigate('course/'+target.dataset.id);return}if(action==='filter'){state.category=target.dataset.category;render();return}if(action==='period'){state.period=target.dataset.period;render();return}if(action==='style'){state.styleOpen=!state.styleOpen;$('#style-area').innerHTML=styleSwitcher();return}if(action==='theme'){state.theme=target.dataset.theme;setStyle();return}if(action==='lesson'){state.lesson=Number(target.dataset.index);state.tab='overview';persist();render();return}if(action==='tab'){state.tab=target.dataset.tab;render();return}if(action==='complete'){finishLesson();return}if(action==='redeem'){state.modal='redeem:'+target.dataset.id;renderModal();return}if(action==='confirmRedeem'){let r=rewards.find(x=>x.id===target.dataset.id);if(r&&state.credits>=r.cost){state.credits-=r.cost;state.redemptions.push(r.name+' (-'+r.cost+' CR)');persist();state.modal=null;render();notify('Demo reward redeemed. No real purchase was made.')}return}if(action==='quiz'){state.modal='quiz';state.selectedAnswer=null;renderModal();return}if(action==='answer'){state.selectedAnswer=target.dataset.value;renderModal();return}if(action==='submitQuiz'){if(state.selectedAnswer!=='b'){notify('Not quite. Think about clarity and purpose.');return}if(!state.quizDone){state.quizDone=true;state.xp+=60;state.weeklyXP+=60;state.credits+=15;persist();notify('Correct! +60 XP and +15 Credits')}else notify('Correct! You already earned the quiz reward.');state.modal=null;render();return}}

function v4Rgb(color){return [1,3,5].map(i=>parseInt(color.slice(i,i+2),16))}
function v4Hex(c){return '#'+c.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function v4Mix(a,b,n){const aa=v4Rgb(a),bb=v4Rgb(b);return v4Hex(aa.map((v,i)=>v*(1-n)+bb[i]*n))}
function v4PaletteColor(id){const v=state.v4Custom;return id==='custom'?[v.background,v.accent,v.ink]:(v4Palettes.find(x=>x.id===id)||v4Palettes[0]).colors}

 for(let [k,v] of Object.entries(values))root.style.setProperty(k,v)

const v7AuthField=(name,type,label,placeholder,other='')=>`<label for="v7-${name}">${label}<input id="v7-${name}" name="${name}" type="${type}" placeholder="${placeholder}" ${other}></label>`;
function v7Signup(){return `<div class="v7-public">${v7guestHeader()}<main class="v7-form-wrap"><div class="v7-auth-card"><div class="v7-signup-badge">✳ &nbsp; STUDENT ACCOUNT · 100% FREE TO JOIN</div><h1>Your next chapter starts here.</h1><p>Tell us a little about you. We'll use your answer to understand how students discover RAWNAK Academy.</p><form id="v7-signup-form" autocomplete="on"><div class="v7-auth-fields">${v7AuthField('name','text','Full name','Your full name','required minlength="2" autocomplete="name"')}<div class="v7-form-two">${v7AuthField('phone','tel','Phone number','e.g. +20 10...','required minlength="7" autocomplete="tel"')}${v7AuthField('email','email','Email address','you@example.com','required autocomplete="email"')}</div>${v7AuthField('password','password','Choose a password','Minimum 8 characters','required minlength="8" autocomplete="new-password"')}<label for="v7-source">How did you hear about us?<select name="source" id="v7-source" required><option value="">Select a source</option><option value="Facebook">Facebook</option><option value="Instagram">Instagram</option><option value="TikTok">TikTok</option><option value="YouTube">YouTube</option><option value="Google Search">Google Search</option><option value="Friends or Family">Friends or Family</option><option value="WhatsApp">WhatsApp</option><option value="Another source">Another source</option></select></label>${v7AuthField('referral','text','Campaign or referral name (optional)','Who or which page referred you?')}</div><div id="v7-signup-error" class="v7-form-error" role="alert"></div><button class="btn primary" type="submit">Create free account ${icon('arrow')}</button><p class="v7-legal">Prototype only: the password is never stored or sent. No secure authentication or email verification is active. Real registration requires a backend and secure authentication.</p><div class="v7-auth-links">Already a member? <a href="#/login">Log in</a> · <a href="#/welcome">Back to the website</a></div></form></div></main></div>`}
function v7Login(){return `<div class="v7-public">${v7guestHeader()}<main class="v7-guest-login"><div class="v7-auth-card"><div class="v7-signup-badge">✳ &nbsp; WELCOME BACK</div><h1>Pick up where you left off.</h1><p>Sign in to your dedicated study space. This preview doesn't validate passwords or provide real authentication.</p><form id="v7-login-form"><div class="v7-auth-fields">${v7AuthField('loginemail','email','Email address','you@example.com','required autocomplete="email"')}${v7AuthField('loginpassword','password','Password (preview only)','Password','required autocomplete="current-password"')}</div><button class="btn primary" type="submit">Open my student space ${icon('ne')}</button><p class="v7-legal">This demo will only open the locally saved student profile with a matching email. It does not check your password. Never enter a real password here.</p></form><div class="v7-auth-links">New to RAWNAK? <a href="#/signup">Create a free student account</a></div><div style="border-top:1px solid #e5eae5;margin-top:27px;padding-top:20px"><span class="v7-signup-badge">DEMO DESIGN PREVIEWS · NO REAL ACCESS</span><p style="font-size:12px">Explore how each account role looks before the backend is built.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm outline" data-action="v7Demo" data-role="student">Student preview</button><button class="btn sm outline" data-action="v7Demo" data-role="instructor">Instructor preview</button><button class="btn sm outline" data-action="v7Demo" data-role="owner">Owner preview</button></div></div></div></main></div>`}

function v7StudentTools(){return `<main class="v7-app-main">${v7PageTitle('STUDENT SPACE / YOUR TOOLS','A little more focus.','A personal toolkit for your courses, notes and next steps.')}${v7Ribbon('Tools are saved in this browser')}<div class="v7-tools-grid"><section class="v7-toolcard"><div class="v7-tool-icon">${icon('note')}</div><div><h3>Quick notes.</h3><p>Capture a thought and find it again here.</p></div></section><section class="v7-toolcard"><div class="v7-tool-icon">${icon('clock')}</div><div><h3>Focus timer.</h3><p>Make space for a 25-minute study session.</p></div></section><section class="v7-toolcard"><div class="v7-tool-icon">${icon('book')}</div><div><h3>Study cards.</h3><p>Flip through a simple flashcard.</p></div></section></div><div class="v7-admin-grid" style="margin-top:20px"><section class="v7-panel"><div class="v7-panel-heading"><h2>Notes to self.</h2><span class="v7-tag">LOCAL</span></div><textarea id="v7-student-notes" class="v7-input" rows="8" placeholder="What did you learn today?">${v7safe(v7get('notes',''))}</textarea><p>Autosaved on this device. For course-specific notes, open the classroom.</p><button class="btn sm outline" data-nav="classroom">Open classroom notes ${icon('ne')}</button></section><section class="v7-panel"><h2>One step at a time.</h2><p>Set aside a quiet study block with fewer distractions.</p><div style="font:800 60px var(--font-display);letter-spacing:-.07em;margin:20px 0" id="v7-timer">${v7TimeText()}</div><div style="display:flex;gap:9px"><button class="btn sm primary" data-action="v7TimerToggle" id="v7-timer-button">Start focus</button><button class="btn sm outline" data-action="v7TimerReset">Reset</button></div><div style="height:1px;background:var(--stroke);margin:25px 0"></div><p class="v7-label">SAMPLE FLASHCARD · FRONTEND</p><button class="v7-ghost" id="v7-flashcard" data-action="v7Flash">${v7FlashSide?'A typeface is a family of related fonts.':'What is a typeface?'} ↻</button></section></div></main>`}

function v74NotesPanel(){let notes=v74NoteForLesson(),legacy=(state.notes?.[state.lesson]||'');return `<div class="v74-tab-intro"><span class="v74-kicker">MY NOTES / TIMESTAMPED</span><h3>Capture an idea at the right moment.</h3><p>Save a note with the current video time, then jump back to that exact moment later.</p></div><form id="v74-note-form" class="v74-note-composer"><label for="v74-note-entry">Your note</label><textarea id="v74-note-entry" rows="3" maxlength="1200" placeholder="What stood out in this lesson?" required></textarea><div class="v74-note-actions"><span id="v74-current-time">Video position ${v74Clock(document.querySelector('#v5-video')?.currentTime||0)}</span><button type="submit" class="btn primary sm">Save with timestamp ↗</button></div></form>${legacy?`<div class="v74-legacy"><strong>Notes from earlier versions</strong><p>${v74Safe(legacy)}</p></div>`:''}<div class="v74-note-stack">${notes.length?notes.map(n=>`<article class="v74-saved-note"><button data-action="v74Seek" data-time="${Number(n.time)||0}" title="Go to this time">${v74Clock(n.time)} ↗</button><div><p>${v74Safe(n.text)}</p><small>Saved locally</small></div><button class="v74-icon-button" aria-label="Delete note" data-action="v74DeleteNote" data-id="${v74Safe(n.id)}">✕</button></article>`).join(''):`<div class="v74-empty">No timestamped notes yet. Play the lesson, pause at a useful moment and save your first idea.</div>`}</div>`}
function v74ResourcesPanel(){const res=v74Resources.filter(r=>r.lesson===state.lesson);return `<div class="v74-tab-intro"><span class="v74-kicker">DOWNLOADS / STUDY MATERIALS</span><h3>Keep the useful things close.</h3><p>These lightweight sample files demonstrate how lesson handouts and project briefs will be organized.</p></div><div class="v74-resource-list">${res.map(r=>`<article class="v74-resource"><div class="v74-resource-icon">↧</div><div><strong>${v74Safe(r.title)}</strong><small>${v74Safe(r.type)} · Markdown file · Sample asset</small></div><button class="btn sm outline" data-action="v74Download" data-id="${r.id}">Download ↗</button></article>`).join('')}</div><div class="v74-quick-link"><span>See resources from every lesson in one place.</span><button class="btn sm outline" data-nav="resources">Open library ↗</button></div>`}
function v74RevisionPanel(){const recs=v74State.review.filter(x=>x.lesson===state.lesson&&x.due<=Date.now());return `<div class="v74-tab-intro"><span class="v74-kicker">ACTIVE RECALL / SMART REVISION</span><h3>Make your progress stick.</h3><p>Questions you missed are queued for practice. Mark an idea as reviewed only after you can explain it yourself.</p></div>${recs.length?recs.map(x=>v74ReviewCard(x)).join(''):`<div class="v74-empty">No review questions are due for this lesson. Take the practice quiz to build your revision queue.</div>`}<button class="btn sm outline" data-nav="revision">All revision cards ↗</button>`}
function v74ReviewCard(x){const q=v74Questions[x.lesson]?.[x.question];if(!q)return '';return `<article class="v74-review-card"><span class="v74-kicker">LESSON ${v74Pad(x.lesson+1)} / NEEDS PRACTICE</span><h3>${v74Safe(q.q)}</h3><details><summary>Reveal explanation</summary><p><strong>${v74Safe(q.choices[q.correct])}</strong> · ${v74Safe(q.why)}</p></details><div class="v74-review-actions"><button class="btn sm outline" data-action="v74OpenLesson" data-lesson="${x.lesson}">Open lesson ↗</button><button class="btn sm primary" data-action="v74ReviewDone" data-id="${v74Safe(x.id)}">I can explain this ↗</button></div></article>`}
const v74OldTabContent=tabContent;
tabContent=function(){if(state.tab==='practice')return v74QuizPanel();if(state.tab==='revision')return v74RevisionPanel();if(state.tab==='notes')return v74NotesPanel();if(state.tab==='resources')return v74ResourcesPanel();return v74OldTabContent()};
const v74OldClassroom=classroomPage;
classroomPage=function(){let html=v74OldClassroom();const tools=`<div class="v74-study-switch"><div><span class="v74-kicker">LESSON EXPERIENCE</span><strong>Choose how you learn</strong></div><div class="v74-mode-buttons"><button class="v74-mode ${v74State.mode==='focus'?'active':''}" data-action="v74Mode" data-mode="focus" aria-pressed="${v74State.mode==='focus'}">◫ Focus</button><button class="v74-mode ${v74State.mode==='interactive'?'active':''}" data-action="v74Mode" data-mode="interactive" aria-pressed="${v74State.mode==='interactive'}">✳ Interactive</button><button class="v74-mode" data-action="v74PiP">⧉ PiP</button><button class="v74-mode" data-action="v74Help">? Shortcuts</button></div></div><div id="v74-checkpoint" aria-live="polite"></div>`;html=html.replace('<div class="class-heading">',tools+'<div class="class-heading">');const marker='</div><div class="lesson-text">';const extras=['practice','revision'].map(x=>`<button role="tab" data-action="tab" data-tab="${x}" aria-selected="${state.tab===x}" class="${state.tab===x?'active':''}">${x==='practice'?'Practice quiz':'Review'}</button>`).join('');html=html.replace(marker,extras+marker);return html.replace('<main class="classroom ',`<main class="classroom v74-classroom v74-${v74State.mode} `)};
function v74StudyHero(){let done=v74State.plans.filter(p=>p.doneWeek===v74WeekStart()).length,all=v74State.plans.length;return `<section class="v74-dashboard-shortcuts"><div><span class="v74-kicker">YOUR LEARNING WORKSPACE</span><h2>Every small step <em>counts.</em></h2><p>Bring your lessons, study plans and projects together in one calm space.</p><div class="v74-dashboard-facts"><span>${done}/${all} weekly study blocks</span><span>${v74State.projects.length} portfolio projects</span><span>${v74State.notes.length} timestamped notes</span></div></div><div class="v74-dashboard-actions"><button class="btn primary sm" data-nav="study-planner">Plan your week ↗</button><button class="btn outline sm" data-nav="revision">Review now ↗</button></div></section>`}
function v74Planner(){let count=v74State.plans.filter(p=>p.doneWeek===v74WeekStart()).length,total=v74State.plans.length;let selectedTime=Number(v74State.weeklyGoal)||20;return `<main class="v7-app-main v74-page">${v74PanelTitle('LEARNING TOOLS / STUDY PLANNER','Make room to <em>learn.</em>','Plan study blocks that fit your week. Every schedule below is editable and saved locally.')}${v74Alert()}<div class="v74-stats">${v74Badge('PLANNED',total+' sessions','Repeating weekly blocks')}${v74Badge('DONE THIS WEEK',count+' / '+total,'A little progress adds up')}${v74Badge('SESSION LENGTH',selectedTime+' min','Your current default')}</div><div class="v74-two-col"><section class="v74-surface"><div class="v74-card-head"><div><span class="v74-kicker">YOUR WEEK</span><h2>One block at a time.</h2></div><span class="v74-tag">WEEKLY PLAN</span></div><div class="v74-week-grid">${v74Week.map(day=>`<div class="v74-day"><div class="v74-day-head">${day}</div>${v74State.plans.filter(p=>p.day===day).map(p=>`<div class="v74-slot ${p.doneWeek===v74WeekStart()?'is-done':''}"><span>${v74Safe(p.topic)}</span><small>${p.minutes} minutes</small><div class="v74-slot-actions"><button data-action="v74TogglePlan" data-id="${v74Safe(p.id)}" title="Toggle completion">${p.doneWeek===v74WeekStart()?'✓ Done':'Mark done'}</button><button data-action="v74RemovePlan" data-id="${v74Safe(p.id)}" title="Remove block">✕</button></div></div>`).join('')||'<p>Free day</p>'}</div>`).join('')}</div></section><aside class="v74-surface"><span class="v74-kicker">BUILD YOUR ROUTINE</span><h2>Add a study block.</h2><p>Choose the right amount of time for your schedule.</p><form id="v74-plan-form" class="v74-stack-form"><label>Day<select name="day" required>${v74Week.map((d,i)=>`<option value="${d}" ${i===(new Date().getDay()+6)%7?'selected':''}>${d}</option>`).join('')}</select></label><label>Focus<select name="topic"><option value="Video lesson">Video lesson</option><option value="Practice quiz">Practice quiz</option><option value="Active revision">Active revision</option><option value="Creative project">Creative project</option></select></label><label>Minutes<select name="minutes">${[10,20,30,40,60].map(m=>`<option value="${m}" ${m===selectedTime?'selected':''}>${m} minutes</option>`).join('')}</select></label><button type="submit" class="btn primary">Add to my week ↗</button></form></aside></div></main>`}
function v74Library(){return `<main class="v7-app-main v74-page">${v74PanelTitle('LEARNING TOOLS / RESOURCE LIBRARY','Your tools, <em>organized.</em>','Simple downloads and practical exercises to keep your learning moving.')}${v74Alert()}<div class="v74-surface"><div class="v74-card-head"><div><span class="v74-kicker">COURSE FILES / DEMO</span><h2>Materials for every lesson.</h2></div><span class="v74-tag">${v74Resources.length} SAMPLE FILES</span></div><div class="v74-library-grid">${v74Resources.map(r=>`<article class="v74-resource-card"><div class="v74-resource-cover"><span>R.</span><small>RAWNAK / MATERIAL ${v74Pad(r.lesson+1)}</small></div><div class="v74-resource-body"><span class="v74-kicker">${v74Safe(r.type)}</span><h3>${v74Safe(r.title)}</h3><p>${v74Safe(lessons[r.lesson].title)} · Downloadable Markdown</p><div class="v74-resource-actions"><button class="btn sm outline" data-action="v74OpenLesson" data-lesson="${r.lesson}">View lesson</button><button class="btn sm primary" data-action="v74Download" data-id="${r.id}">Download ↗</button></div></div></article>`).join('')}</div></div></main>`}
function v74RevisionHub(){let due=v74State.review.filter(x=>x.due<=Date.now());let future=v74State.review.length-due.length;let attempts=Object.values(v74State.quizzes).reduce((a,r)=>a+(r.attempts||0),0);return `<main class="v7-app-main v74-page">${v74PanelTitle('LEARNING TOOLS / ACTIVE RECALL','Learn it. <em>Keep it.</em>','Practice the ideas you missed instead of replaying every minute of a lesson.')}${v74Alert()}<div class="v74-stats">${v74Badge('DUE NOW',due.length+' cards','Concepts that need practice')}${v74Badge('SCHEDULED',future+' cards','Coming back for review')}${v74Badge('QUIZ ATTEMPTS',attempts,'Practice attempts saved locally')}</div><section class="v74-surface"><div class="v74-card-head"><div><span class="v74-kicker">REVIEW QUEUE</span><h2>Make it memorable.</h2></div><button class="btn sm outline" data-nav="classroom">Open classroom ↗</button></div>${due.length?`<div class="v74-review-grid">${due.map(v74ReviewCard).join('')}</div>`:`<div class="v74-empty"><h3>Nothing is due right now.</h3><p>Try the practice quizzes after your lessons. Missed concepts will appear here automatically.</p><button class="btn sm primary" data-nav="classroom">Try a lesson quiz ↗</button></div>`}<p class="v74-small">Correctly reviewed cards return after 1, then 3, then 7 days. Timing is illustrative and saved only in this browser.</p></section></main>`}
function v74Portfolio(){return `<main class="v7-app-main v74-page">${v74PanelTitle('MY LEARNING / PORTFOLIO','Show the work <em>you made.</em>','Collect small projects and learning milestones that you can build on over time.')}${v74Alert()}<div class="v74-two-col"><section class="v74-surface"><div class="v74-card-head"><div><span class="v74-kicker">MY PROJECTS</span><h2>Built with intention.</h2></div><span class="v74-tag">${v74State.projects.length} DRAFTS</span></div>${v74State.projects.length?`<div class="v74-project-grid">${v74State.projects.slice().reverse().map((p,i)=>`<article class="v74-project"><div class="v74-project-cover"><span>${v74Pad(v74State.projects.length-i)}</span><strong>PROJECT / RAWNAK</strong></div><div class="v74-project-content"><span class="v74-kicker">${v74Safe(p.status)} · LOCAL DRAFT</span><h3>${v74Safe(p.title)}</h3><p>${v74Safe(p.summary)}</p><button class="btn sm outline" data-action="v74RemoveProject" data-id="${v74Safe(p.id)}">Remove draft</button></div></article>`).join('')}</div>`:`<div class="v74-empty"><h3>Your story starts with a project.</h3><p>Add an exercise, idea or design you've practiced during the course.</p></div>`}<div class="v74-certificate"><span>✧</span><div><h3>Verified certificates</h3><p>No issued certificates yet. Verification requires real assessment and an approved backend.</p></div></div></section><aside class="v74-surface"><span class="v74-kicker">CREATE A PROJECT</span><h2>Add a portfolio draft.</h2><form id="v74-project-form" class="v74-stack-form"><label>Project title<input name="title" maxlength="70" required placeholder="e.g. My first course landing page"></label><label>Project summary<textarea name="summary" maxlength="700" rows="5" required placeholder="What did you build, practice or learn?"></textarea></label><label>Progress<select name="status"><option value="In progress">In progress</option><option value="Ready for review">Ready for review</option><option value="Complete">Complete</option></select></label><button type="submit" class="btn primary">Add project ↗</button></form></aside></div></main>`}
const v74OldStudent=v7ClassicalStudent;
v7ClassicalStudent=function(route){if(route==='study-planner')return v74Planner();if(route==='resources')return v74Library();if(route==='revision')return v74RevisionHub();if(route==='portfolio')return v74Portfolio();let html=v74OldStudent(route);if(route==='my-learning')html=html.replace('<div class="v7-student-wrap">','<div class="v7-student-wrap">'+v74StudyHero());return html};
v7AllowedStudent.push('study-planner','resources','revision','portfolio');
const v74ToolsLinkIdx=v7nav.student.findIndex(x=>x[0]==='tools');
v7nav.student.splice(v74ToolsLinkIdx+1,0,['study-planner','Study planner','clock'],['resources','Resources','book'],['revision','Revision','spark'],['portfolio','Portfolio','trophy']);
const v74OldTools=v7Pages.tools;
v7Pages.tools=function(){let html=v74OldTools();const quick=`<section class="v74-tool-links"><span class="v74-kicker">EXPLORE YOUR STUDY SPACE</span><div><button class="btn sm outline" data-nav="study-planner">Weekly planner ↗</button><button class="btn sm outline" data-nav="resources">Resource library ↗</button><button class="btn sm outline" data-nav="revision">Revision cards ↗</button><button class="btn sm outline" data-nav="portfolio">Portfolio ↗</button></div></section>`;return html.replace('</main>',quick+'</main>')};
function v74UpdateTab(){const panel=document.querySelector('.classroom .lesson-text');if(panel)panel.innerHTML=tabContent();document.querySelectorAll('.classroom .class-tabs [data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===state.tab);b.setAttribute('aria-selected',String(b.dataset.tab===state.tab))})}
function v74SetMode(m){if(!['focus','interactive'].includes(m))return;v74State.mode=m;v74Save();const c=document.querySelector('.v74-classroom');if(c){c.classList.toggle('v74-focus',m==='focus');c.classList.toggle('v74-interactive',m==='interactive')}document.querySelectorAll('.v74-mode[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===m);b.setAttribute('aria-pressed',String(b.dataset.mode===m))});const checkpoint=document.getElementById('v74-checkpoint');if(checkpoint&&m==='focus')checkpoint.innerHTML='';notify(m==='focus'?'Focus mode: prompts are hidden.':'Interactive mode: optional learning checkpoints are on.')}
function v74MountPlayer(){const vid=document.querySelector('#v5-video');if(!vid)return;vid.addEventListener('timeupdate',()=>{const timelabel=document.querySelector('#v74-current-time');if(timelabel)timelabel.textContent='Video position '+v74Clock(vid.currentTime);if(v74State.mode!=='interactive'||!Number.isFinite(vid.duration)||vid.duration<3)return;const id=String(state.lesson);if(!v74State.promptSeen[id]&&vid.currentTime>=Math.max(2,vid.duration*.60)){v74State.promptSeen[id]=true;v74Save();vid.pause();const cp=document.getElementById('v74-checkpoint');if(cp)cp.innerHTML='<div class="v74-checkpoint"><span>✳ OPTIONAL KNOWLEDGE CHECK</span><strong>Ready to see what you remember?</strong><div><button class="btn sm primary" data-action="v74TryQuiz">Try two questions ↗</button><button class="btn sm outline" data-action="v74DismissCheckpoint">Keep watching</button></div></div>'}})}
function v74Download(id){const r=v74Resources.find(x=>x.id===id);if(!r)return;const url=URL.createObjectURL(new Blob([r.contents],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=r.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Sample study resource downloaded.')}
function v74ReviewMark(id){const rec=v74State.review.find(r=>r.id===id);if(!rec)return;rec.reps=(rec.reps||0)+1;rec.due=Date.now()+[1,3,7][Math.min(rec.reps-1,2)]*86400000;v74Save();if(activeRoute()==='classroom')v74UpdateTab();else render();notify('Revision scheduled for later. Great practice!')}
const v74OldAction=handleAction;
handleAction=function(t){const a=t.dataset.action;if(a==='tab'&&v7role()==='student'&&activeRoute()==='classroom'){state.tab=t.dataset.tab;persist();v74UpdateTab();return}
 if(a==='v74Mode'){v74SetMode(t.dataset.mode);return}
 if(a==='v74Answer'){let r=v74QuizForLesson();r.answers={...(r.answers||{}),[Number(t.dataset.q)]:Number(t.dataset.choice)};r.reviewed=false;v74State.quizzes[state.lesson]=r;v74Save();v74UpdateTab();return}
 if(a==='v74SubmitQuiz'){let rec=v74QuizForLesson(),q=v74Questions[state.lesson];if(q.some((_,i)=>rec.answers?.[i]===undefined)){notify('Answer both questions first.');return}let wrong=q.map((z,i)=>i).filter(i=>rec.answers[i]!==q[i].correct);rec.attempts=(rec.attempts||0)+1;rec.best=Math.max(rec.best||0,q.length-wrong.length);rec.wrong=wrong;rec.reviewed=true;v74State.quizzes[state.lesson]=rec;for(const i of wrong){const key=`${state.lesson}_${i}`;if(!v74State.review.some(x=>x.id===key))v74State.review.push({id:key,lesson:state.lesson,question:i,due:Date.now(),reps:0})}v74Save();v74UpdateTab();notify(wrong.length?`${q.length-wrong.length}/${q.length} correct. Review the explanations below.`:`Perfect! ${q.length}/${q.length} correct.`);return}
 if(a==='v74DeleteNote'){v74State.notes=v74State.notes.filter(n=>n.id!==t.dataset.id);v74Save();v74UpdateTab();return}
 if(a==='v74Seek'){const video=document.querySelector('#v5-video');if(video){video.currentTime=Math.max(0,Number(t.dataset.time)||0);video.scrollIntoView({behavior:'smooth',block:'center'});notify('Jumped to saved moment.')}return}
 if(a==='v74Download'){v74Download(t.dataset.id);return}
 if(a==='v74TogglePlan'||a==='v74RemovePlan'){const p=v74State.plans.find(x=>x.id===t.dataset.id);if(!p)return;if(a==='v74RemovePlan')v74State.plans=v74State.plans.filter(x=>x.id!==p.id);else p.doneWeek=p.doneWeek===v74WeekStart()?'':v74WeekStart();v74Save();render();return}
 if(a==='v74ReviewDone'){v74ReviewMark(t.dataset.id);return}
 if(a==='v74OpenLesson'){const n=Number(t.dataset.lesson);if(Number.isInteger(n)&&n>=0&&n<lessons.length){state.lesson=n;state.tab='overview';persist();navigate('classroom')}return}
 if(a==='v74RemoveProject'){v74State.projects=v74State.projects.filter(p=>p.id!==t.dataset.id);v74Save();render();return}
 if(a==='v74PiP'){const video=document.querySelector('#v5-video');if(!video)return;if(!document.pictureInPictureEnabled||!video.requestPictureInPicture)return notify('Picture-in-Picture is not supported in this browser.');video.requestPictureInPicture().catch(()=>notify('Picture-in-Picture could not start.'));return}
 if(a==='v74Help'){const box=document.getElementById('v74-shortcuts');if(box)box.remove();else{const el=document.createElement('div');el.id='v74-shortcuts';el.className='v74-shortcuts';el.innerHTML='<strong>Video shortcuts</strong><p>Space: play / pause · ← and →: skip 5s · N: notes · Q: quiz</p><button class="btn sm outline" data-action="v74Help">Close</button>';document.body.appendChild(el)}return}
 if(a==='v74TryQuiz'){document.getElementById('v74-checkpoint')?.replaceChildren();state.tab='practice';persist();v74UpdateTab();document.querySelector('.classroom .class-tabs')?.scrollIntoView({behavior:'smooth',block:'center'});return}
 if(a==='v74DismissCheckpoint'){document.getElementById('v74-checkpoint')?.replaceChildren();document.querySelector('#v5-video')?.play().catch(()=>{});return}
 return v74OldAction(t)};
document.addEventListener('submit',e=>{if(!['v74-note-form','v74-plan-form','v74-project-form'].includes(e.target.id))return;e.preventDefault();if(v7role()!=='student')return;
 if(e.target.id==='v74-note-form'){const text=e.target.querySelector('textarea')?.value.trim();if(!text)return;const sec=Math.round(document.querySelector('#v5-video')?.currentTime||0);v74State.notes.push({id:'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),lesson:state.lesson,time:sec,text:text.slice(0,1200)});v74Save();v74UpdateTab();notify('Timestamped note saved on this device.');return}
 const fd=new FormData(e.target);if(e.target.id==='v74-plan-form'){const day=String(fd.get('day')),topic=String(fd.get('topic')),minutes=Number(fd.get('minutes'));if(!v74Week.includes(day)||!['Video lesson','Practice quiz','Active revision','Creative project'].includes(topic)||![10,20,30,40,60].includes(minutes))return;v74State.weeklyGoal=minutes;v74State.plans.push({id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),day,topic,minutes,doneWeek:''});v74Save();render();notify('Study block added to your weekly plan.');return}
 if(e.target.id==='v74-project-form'){let title=String(fd.get('title')||'').trim().slice(0,70),summary=String(fd.get('summary')||'').trim().slice(0,700),status=String(fd.get('status')||'In progress');if(!title||!summary||!['In progress','Ready for review','Complete'].includes(status))return;v74State.projects.push({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),title,summary,status});v74Save();render();notify('Portfolio draft saved locally.')}});

var QRMode = require('./QRMode');

function QR8bitByte(data) {
	this.mode = QRMode.MODE_8BIT_BYTE;
	this.data = data;
}

QR8bitByte.prototype = {

	getLength : function() {
		return this.data.length;
	},
	
	write : function(buffer) {
		for (var i = 0; i < this.data.length; i++) {
			// not JIS ...
			buffer.put(this.data.charCodeAt(i), 8);
		}
	}
};

module.exports = QR8bitByte;

mods['QRBitBuffer'] = function(require,module,exports) {
function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

QRBitBuffer.prototype = {

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}
};

module.exports = QRBitBuffer;

mods['QRMath'] = function(require,module,exports) {
var QRMath = {

	glog : function(n) {
	
		if (n < 1) {
			throw new Error("glog(" + n + ")");
		}
		
		return QRMath.LOG_TABLE[n];
	},
	
	gexp : function(n) {
	
		while (n < 0) {
			n += 255;
		}
	
		while (n >= 256) {
			n -= 255;
		}
	
		return QRMath.EXP_TABLE[n];
	},
	
	EXP_TABLE : new Array(256),
	
	LOG_TABLE : new Array(256)

};
	
for (var i = 0; i < 8; i++) {
	QRMath.EXP_TABLE[i] = 1 << i;
}
for (var i = 8; i < 256; i++) {
	QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4]
		^ QRMath.EXP_TABLE[i - 5]
		^ QRMath.EXP_TABLE[i - 6]
		^ QRMath.EXP_TABLE[i - 8];
}
for (var i = 0; i < 255; i++) {
	QRMath.LOG_TABLE[QRMath.EXP_TABLE[i] ] = i;
}

module.exports = QRMath;

mods['QRPolynomial'] = function(require,module,exports) {
var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

module.exports = QRPolynomial;

		totalDataCount += rsBlocks[x].dataCount;
	}

ect></label><div class="v75-grid2"><label>Lesson<select name="lesson">${lessons.map((l,i)=>`<option value="${i}">${i+1} · ${v75Escape(l.title)}</option>`).join('')}</select></label><label>Difficulty<select name="level"><option>Easy</option><option>Medium</option><option>Advanced</option></select></label></div><label>Topic<input name="topic" required maxlength="50" placeholder="e.g. Typography"></label><label>Question<textarea name="question" required maxlength="240" placeholder="Write a clear, answerable question"></textarea></label>${['A','B','C'].map(x=>`<label>Answer ${x}<input name="choice${x}" required maxlength="125" placeholder="Option ${x}"></label>`).join('')}<label>Correct answer<select name="correct"><option value="0">A</option><option value="1">B</option><option value="2">C</option></select></label><label>Explanation<textarea name="explanation" maxlength="380" placeholder="Explain why the right answer is correct"></textarea></label><button type="submit" class="v75-button primary">Save question ↗</button></form></aside></div></main>`}

function v75StudentBooks(){return `<main class="v7-app-main v75-page">${v75Heading('STUDENT TOOLS / SMART BOOKS','Books that <em>open doors.</em>','Find a chapter from a printed companion, scan its QR, and continue learning without searching for the right lesson.',`<button class="v75-button" data-nav="split-study">Open Split Study ↗</button>`)}${v75Demo}<div class="v75-layout"><section class="v75-panel"><div class="v75-panelhead"><div><span class="v75-eye">BOOK COMPANIONS</span><h2>Your printed-to-digital library.</h2></div><span class="v75-chip">${v75Books.length} SAMPLE BOOKS</span></div>${v75Books.map(b=>`<section class="v75-sect"><div class="v75-panelhead" style="margin-bottom:10px"><div><span class="v75-eye">${v75Escape(b.edition)}</span><h3>${v75Escape(b.title)}</h3><p>${v75Escape(b.description)}</p></div></div><div class="v75-module-list">${b.chapters.map(c=>`<div class="v75-module"><span class="v75-number">${v75Escape(c.page||'—')}</span><span>${v75Escape(c.label)}<br/><small class="v75-muted">${v75Escape(c.kind)} · ${v75Escape(lessons[c.lesson]?.title||'Lesson')}</small></span><button class="v75-button tiny" data-action="v75OpenBookLink" data-id="${v75Escape(c.id)}">Open ↗</button></div>`).join('')}</div></section>`).join('')}</section><aside class="v75-panel"><span class="v75-eye">OPEN A PRINTED QR</span><h2>Have a book in hand?</h2><p>Use your camera to scan a QR code, or paste a RAWNAK Academy book link here.</p><form id="v75-book-link-form" class="v75-form"><label>Book URL or QR ID<input name="link" required placeholder="Paste a book URL or qr-design-01"></label><button class="v75-button primary" type="submit">Open linked lesson ↗</button></form><div class="v75-fineprint">The code tells us which lesson to preview. Enrolled-only content will require a real account and entitlements in V8.</div></aside></div></main>`}

function v75SplitStudy(){const x=v75BookReadings[v75ReaderLesson]||v75BookReadings[0];const notes=v74State.notes.filter(n=>n.lesson===v75ReaderLesson);return `<main class="v7-app-main v75-page">${v75Heading('STUDENT TOOLS / SPLIT STUDY','Watch, read, <em>connect.</em>','A quiet workspace combining a sample lesson video and a reading companion — designed for focused practice.',`<button class="v75-button" data-nav="classroom">Open Cinema Classroom ↗</button>`)}${v75Demo}<div class="v75-reader-tools"><label class="v75-label">Current lesson<select id="v75-reader-lesson" class="v75-control" style="min-width:270px">${lessons.map((l,i)=>`<option value="${i}" ${i===v75ReaderLesson?'selected':''}>${i+1}. ${v75Escape(l.title)}</option>`).join('')}</select></label><div class="v75-reader-tabs"><button class="v75-button ${v75ReaderTab==='book'?'on':''}" data-action="v75ReaderTab" data-tab="book">Book text</button><button class="v75-button ${v75ReaderTab==='notes'?'on':''}" data-action="v75ReaderTab" data-tab="notes">My notes (${notes.length})</button></div></div><div class="v75-split"><div class="v75-video"><video id="v75-split-video" controls preload="metadata" playsinline src="${v75SafeSampleVideo()}"></video><caption>Illustrative video sample · course-specific assets require the V8 content system.</caption></div><aside class="v75-reading"><span class="v75-kicker">BOOK COMPANION / LESSON ${String(v75ReaderLesson+1).padStart(2,'0')}</span>${v75ReaderTab==='notes'?`<h2>Notes for this lesson.</h2>${notes.length?notes.map(n=>`<p><strong>${v74Clock(n.time)}</strong> · ${v75Escape(n.text)}</p>`).join(''):'<p>No notes yet. Add a note below and use Cinema Classroom to review it.</p>'}<form id="v75-split-note-form" class="v75-form"><label>Your note<textarea name="text" required maxlength="1200" placeholder="Write down an idea or question"></textarea></label><button class="v75-button primary" type="submit">Save note ↗</button></form>`:`<h2>${v75Escape(x.title)}</h2><div class="v75-quote">${v75Escape(x.lead)}</div>${x.paras.map(p=>`<p>${v75Escape(p)}</p>`).join('')}<div class="v75-classroom-callout"><div><strong>Remember what matters.</strong><p>Try an active recall quiz in the full classroom.</p></div><button class="v75-button tiny" data-action="v75OpenFullLesson">Study ↗</button></div>`}</aside></div><div class="v75-fineprint">Split Study preserves the learner's notes locally. It does not grant a paid course entitlement or store any activity server-side.</div></main>`}

 if(a==='v75SelectQR'){v75SelectedQR=id;v75Save();render();return}
