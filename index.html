 if(a==='v75RemoveQuestion'&&v7role()==='instructor'){v75Questions=v75Questions.filter(q=>q.id!==id);v75Save();render();return}
 if(a==='v75ToggleQuestion'&&v7role()==='instructor'){const q=v75Questions.find(q=>q.id===id);if(q)q.published=!q.published;v75Save();render();return}
 if(a==='v75ExportQuestions'&&v7role()==='instructor'){const data=JSON.stringify({schema:'rawnak-academy-question-bank-demo-v1',questions:v75Questions},null,2);v75DownloadBlob(new Blob([data],{type:'application/json'}),'rawnak-question-bank-demo.json');notify('JSON question bank downloaded.');return}
 if(a==='v75OpenBookLink'){navigate('book/'+id);return}
 if(a==='v75EnterChapter'){const entry=v75StaticEntry(id);if(!entry)return;state.lesson=entry.chapter.lesson;state.tab=entry.chapter.kind==='quiz'?'practice':entry.chapter.kind==='resource'?'resources':'overview';persist();navigate('classroom');return}
 if(a==='v75ReaderTab'){v75ReaderTab=t.dataset.tab==='notes'?'notes':'book';render();return}
 if(a==='v75OpenFullLesson'){state.lesson=v75ReaderLesson;state.tab='overview';persist();navigate('classroom');return}
 return v75OldAction(t)
};
document.addEventListener('submit',e=>{
 if(e.target.id==='v75-book-form'){e.preventDefault();if(v7role()!=='instructor')return;const fd=new FormData(e.target);const title=String(fd.get('title')||'').trim().slice(0,85),edition=String(fd.get('edition')||'').trim().slice(0,40),description=String(fd.get('description')||'').trim().slice(0,220),course=String(fd.get('course')||'design');if(title.length<3||!edition||!courses.some(c=>c.id===course))return notify('Add a title and edition.');const id=v75Id();v75Books.push({id,title,edition,description,course,chapters:[]});v75Selected=id;v75SelectedQR=null;v75Save();render();notify('Book draft created locally.');return}
 if(e.target.id==='v75-qr-form'){e.preventDefault();if(v7role()!=='instructor')return;const fd=new FormData(e.target);let b=v75Book(String(fd.get('bookId'))),lesson=Number(fd.get('lesson')),kind=String(fd.get('kind')),page=String(fd.get('page')||'').trim().slice(0,8),label=String(fd.get('label')||'').trim().slice(0,85);if(!b||!Number.isInteger(lesson)||lesson<0||lesson>=lessons.length||!['lesson','quiz','resource','preview'].includes(kind)||!label)return notify('Complete all required QR details.');const id=v75Id();b.chapters.push({id,lesson,kind,page,label,enabled:true});v75SelectedQR=id;v75Save();render();notify('Lesson QR created. Open QR Print Studio to export.');return}
 if(e.target.id==='v75-question-form'){e.preventDefault();if(v7role()!=='instructor')return;const fd=new FormData(e.target);const question=String(fd.get('question')||'').trim().slice(0,240),topic=String(fd.get('topic')||'').trim().slice(0,50),choices=['A','B','C'].map(k=>String(fd.get('choice'+k)||'').trim().slice(0,125)),correct=Number(fd.get('correct')),lesson=Number(fd.get('lesson')),course=String(fd.get('course')||'design'),level=String(fd.get('level')||'Easy'),explanation=String(fd.get('explanation')||'').trim().slice(0,380);if(!question||!topic||choices.some(c=>!c)||!Number.isInteger(correct)||correct<0||correct>2||!Number.isInteger(lesson)||lesson<0||lesson>=lessons.length||!courses.some(c=>c.id===course))return notify('Please complete the question and three answers.');v75Questions.push({id:v75Id(),question,topic,choices,correct,lesson,course,level,explanation,published:false});v75Save();render();notify('Question saved as local draft.');return}
 if(e.target.id==='v75-book-link-form'){e.preventDefault();let link=String(new FormData(e.target).get('link')||'').trim();let id='';if(link.includes('#/book/'))id=link.split('#/book/')[1].split(/[?&]/)[0];else if(/^[a-zA-Z0-9-]{3,90}$/.test(link))id=link;try{id=decodeURIComponent(id)}catch{}if(!id||!v75StaticEntry(id))return notify('This QR is not available in the current preview. Try qr-design-01.');navigate('book/'+id);return}
 if(e.target.id==='v75-split-note-form'){e.preventDefault();if(v7role()!=='student')return;let text=String(new FormData(e.target).get('text')||'').trim().slice(0,1200);if(!text)return;const sec=Math.round(document.getElementById('v75-split-video')?.currentTime||0);v74State.notes.push({id:v75Id(),lesson:v75ReaderLesson,time:sec,text});v74Save();v75ReaderTab='notes';render();notify('Study note saved on this device.');return}
});
document.addEventListener('input',e=>{if(e.target.id==='v75-question-search'){v75QuestionFilter=e.target.value;const node=e.target;let sel=node.selectionStart;let parent=node.closest('.v75-panel');if(parent){const list=v75Questions.filter(q=>`${q.question} ${q.topic} ${q.level}`.toLowerCase().includes(v75QuestionFilter.toLowerCase()));parent.querySelectorAll('.v75-question-item').forEach(x=>x.remove());const host=document.createElement('div');host.innerHTML=list.map(v75QuestionCard).join('');parent.append(...host.children);const badge=parent.querySelector('.v75-chip');if(badge)badge.textContent=list.length+' FOUND';}}});
document.addEventListener('change',e=>{if(e.target.id==='v75-reader-lesson'){const n=Number(e.target.value);if(Number.isInteger(n)&&n>=0&&n<lessons.length){v75ReaderLesson=n;render()}}});
const v75PrevRender=render;
render=function(){v75PrevRender();if(v7role()==='student'&&activeRoute()==='my-learning'){const host=document.querySelector('.v7-workarea .v7-app-main');if(host){host.insertAdjacentHTML('beforeend',`<section class="v75-classroom-callout" style="margin:20px 25px"><div><span class="v75-eye">NEW / SMART BOOKS</span><strong>Take your printed workbook online.</strong><p>Read chapters side by side with the lesson video.</p></div><button class="v75-button primary" data-nav="book-library">Open Smart Books ↗</button></section>`)}}};


/* RAWNAK Academy V7.6 — interactive public demo controls. No backend mutation. */
function v76Step(index){
 const stages=[
  {title:'Your next step<br>starts here.',tag:'CURATED LEARNING',course:'Explore creative skills',desc:'Find a course that fits your ambition.',metric:'01',width:26,ft:'Build real skills',fd:'One step at a time'},
  {title:'Make every lesson<br>matter.',tag:'FOCUSED CLASSROOM',course:'Design your first project',desc:'Learn, practice, make progress.',metric:'02',width:63,ft:'Stay in your flow',fd:'Notes · Practice · Video'},
  {title:'Look how far<br>you have come.',tag:'YOUR ACHIEVEMENTS',course:'Skills worth celebrating',desc:'Turn the work into confidence.',metric:'03',width:100,ft:'A milestone reached',fd:'Earn rewards as you grow'}
 ]; const s=stages[((index%stages.length)+stages.length)%stages.length];
 const updates={'v76-device-title':s.title,'v76-device-tag':s.tag,'v76-device-course':s.course,'v76-device-desc':s.desc,'v76-device-metric':s.metric,'v76-float-title':s.ft,'v76-float-desc':s.fd};
 for(const [id,val] of Object.entries(updates)){let n=document.getElementById(id);if(n)n.innerHTML=val}
 let bar=document.getElementById('v76-device-progress');if(bar)bar.style.width=s.width+'%';
 document.querySelectorAll('[data-v76-step]').forEach((el,i)=>{el.classList.toggle('is-active',i===index);el.setAttribute('aria-pressed',String(i===index))});
 window.__v76CurrentStep=index;
}
function v76Story(index){
 const rows=[
  ['YOUR LEARNING SPACE','A clear start.<br>Made for you.','Personal recommendations based on your goals.'],
  ['FOCUS CLASSROOM','A calmer way<br>to keep going.','Video, notes and practice in one thoughtful place.'],
  ['YOUR PROGRESS','Every small step<br>adds up.','Visible milestones and meaningful rewards.']
 ];index=((index%3)+3)%3;
 const ids=['v76-story-kicker','v76-story-head','v76-story-description'];
 ids.forEach((id,i)=>{let el=document.getElementById(id);if(el)el.innerHTML=rows[index][i]});
 let meter=document.getElementById('v76-story-count');if(meter)meter.textContent=String(index+1).padStart(2,'0')+' / 03';
 let bar=document.getElementById('v76-story-bar');if(bar)bar.style.width=((index+1)*33.333)+'%';
 document.querySelectorAll('[data-v76-story]').forEach((el,i)=>el.classList.toggle('is-active',i===index));
 window.__v76CurrentStory=index;
}
function v76Init(){
 const root=document.querySelector('.v76-public'); if(!root)return;
 v76Step(0);v76Story(0);
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 const visible=Array.from(root.querySelectorAll('.v76-reveal'));
 if(!reduced&&'IntersectionObserver'in window){
  const obs=new IntersectionObserver(entries=>{for(const ent of entries)if(ent.isIntersecting){ent.target.classList.add('v76-visible');obs.unobserve(ent.target)}},{threshold:.08,rootMargin:'0px 0px 20px 0px'});
  visible.forEach(el=>obs.observe(el));
  root.classList.add('v76-ready');
 }else visible.forEach(el=>el.classList.add('v76-visible'));
 if(window.__v76HeroTimer)clearInterval(window.__v76HeroTimer);
 if(!reduced){window.__v76HeroTimer=setInterval(()=>{
  if(!document.querySelector('.v76-public')||document.hidden)return;
  if(Date.now()-(window.__v76ManualAt||0)<14000)return;
  const hero=document.querySelector('.v76-hero');if(hero&&hero.getBoundingClientRect().bottom>0)v76Step(((window.__v76CurrentStep||0)+1)%3);
 },5100)}
}
document.addEventListener('click',e=>{
 let t=e.target.closest('[data-v76-step]');if(t){const n=Number(t.dataset.v76Step);window.__v76ManualAt=Date.now();v76Step(n);return}
 t=e.target.closest('[data-v76-story]');if(t){v76Story(Number(t.dataset.v76Story));return}
 t=e.target.closest('[data-v76-story-next]');if(t){v76Story((window.__v76CurrentStory||0)+1);return}
 t=e.target.closest('[data-v76-story-prev]');if(t){v76Story((window.__v76CurrentStory||0)-1);return}
 t=e.target.closest('[data-v76-gift]');if(t){
  const messages={believe:'I believe in everything you\'re becoming.',proud:'You worked so hard. I\'m so proud of you.',just:'A small reminder that you matter.'};
  const m=document.getElementById('v76-gift-message');if(m)m.textContent=messages[t.dataset.v76Gift]||messages.believe;
  document.querySelectorAll('[data-v76-gift]').forEach(b=>{let a=b===t;b.classList.toggle('is-active',a);b.setAttribute('aria-pressed',String(a))});return;
 }
 t=e.target.closest('[data-v76-qr-demo]');if(t){const s=document.getElementById('v76-books-scene');if(!s)return;s.classList.toggle('is-scanned');t.innerHTML=s.classList.contains('is-scanned')?'Close chapter preview <span>↗</span>':'Try the QR experience <span>↗</span>';t.setAttribute('aria-expanded',String(s.classList.contains('is-scanned')))}
});
document.addEventListener('pointermove',e=>{
 if(e.pointerType==='touch'||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const z=e.target.closest('.v76-tilt-zone');if(!z)return;
 let d=document.getElementById('v76-device');if(!d)return;
 const box=z.getBoundingClientRect(), x=(e.clientX-box.left)/box.width-.5,y=(e.clientY-box.top)/box.height-.5;
 d.style.transform=`rotate(${(-6+x*4).toFixed(2)}deg) rotateY(${(-7+x*8).toFixed(2)}deg) rotateX(${(-y*6).toFixed(2)}deg)`;
});
document.addEventListener('pointerout',e=>{if(e.target.closest('.v76-tilt-zone')&&!e.relatedTarget?.closest?.('.v76-tilt-zone')){const d=document.getElementById('v76-device');if(d)d.style.transform=''}});

</script>
<script id="rawnak-v8-menu-behavior">
/* Menu is native <details> for keyboard and no-JS fallback. */
document.addEventListener('click', function (event) {
  const openMenu = document.querySelector('.v76-public .v8-nav-dropdown[open]');
  if (!openMenu) return;
  const inside = event.target.closest('.v8-nav-dropdown');
  if (!inside || event.target.closest('.v8-mobile-links a, .v8-mobile-links button')) openMenu.open = false;
});
document.addEventListener('keydown', function (event) {
  if (event.key !== 'Escape') return;
  const openMenu = document.querySelector('.v76-public .v8-nav-dropdown[open]');
  if (openMenu) { openMenu.open=false; openMenu.querySelector('summary')?.focus(); }
});
